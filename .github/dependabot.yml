version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      # The Expo SDK moves as a unit; one PR beats twenty that must land together.
      expo:
        patterns:
          - 'expo'
          - 'expo-*'
          - '@expo/*'
      react-navigation:
        patterns:
          - '@react-navigation/*'
      dev-tooling:
        patterns:
          - 'eslint*'
          - 'jest*'
          - '@types/*'
          - 'typescript'
    ignore:
      # React and React Native versions are dictated by the Expo SDK, so bumping
      # them independently breaks the install rather than updating it.
      - dependency-name: react
      - dependency-name: react-dom
      - dependency-name: react-native

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
